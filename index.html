<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#101510" />
  <title>DHS SHIELD // Lost Forest</title>
  <style>
    :root {
      --bg: #0c100d;
      --panel: #151b17;
      --ink: #f7f2df;
      --muted: #abb8ad;
      --red: #ba1d2c;
      --green: #96d33b;
      --gold: #f0c34a;
      --line: #2c382e;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: radial-gradient(circle at top, #1a241c, var(--bg) 55%); color: var(--ink); font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    body { display: flex; justify-content: center; padding: 24px 14px 40px; }
    main { width: min(920px, 100%); }
    .masthead { text-align: center; margin-bottom: 14px; }
    .eyebrow { color: var(--green); letter-spacing: .18em; font-weight: 800; font-size: .8rem; }
    h1 { margin: 7px 0 7px; font-size: clamp(1.65rem, 5vw, 3rem); letter-spacing: .04em; }
    .intro { margin: 0 auto; max-width: 720px; color: var(--muted); line-height: 1.45; }
    .game-shell { margin-top: 18px; background: #090c0a; border: 2px solid #39473b; box-shadow: 0 18px 60px #0008; border-radius: 16px; padding: 14px; }
    .status-row { display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; margin-bottom: 10px; }
    .status { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .chip { border: 1px solid var(--line); background: var(--panel); color: var(--muted); padding: 7px 10px; border-radius: 999px; font-size: .84rem; }
    .chip strong { color: var(--ink); }
    .sequence { letter-spacing: .18em; color: var(--gold); font-weight: 900; }
    .reset { border: 1px solid #56645a; background: #202820; color: var(--ink); padding: 8px 11px; border-radius: 9px; font: inherit; cursor: pointer; }
    .reset:hover { border-color: var(--green); }
    .canvas-wrap { position: relative; border: 4px solid #d3a83b; border-radius: 10px; overflow: hidden; background: #10280f; }
    canvas { width: 100%; height: auto; aspect-ratio: 64/42; display: block; image-rendering: pixelated; touch-action: none; }
    .flash { position: absolute; inset: 0; pointer-events: none; opacity: 0; background: #fff; transition: opacity .16s linear; }
    .flash.on { opacity: .38; }
    .instructions { text-align: center; color: var(--muted); font-size: .86rem; margin: 11px 0 4px; }
    .dpad { margin: 13px auto 0; width: 190px; display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 7px; user-select: none; }
    .dpad button { min-height: 52px; border-radius: 10px; border: 1px solid #48584c; background: #1b241d; color: var(--ink); font-size: 1.35rem; font-weight: 900; cursor: pointer; touch-action: none; }
    .dpad button:active, .dpad button.active { background: #364936; border-color: var(--green); color: var(--green); }
    .dpad .up { grid-column: 2; }
    .dpad .left { grid-column: 1; grid-row: 2; }
    .dpad .down { grid-column: 2; grid-row: 2; }
    .dpad .right { grid-column: 3; grid-row: 2; }
    .success { display: none; margin-top: 16px; padding: 18px; border: 3px solid var(--gold); background: linear-gradient(135deg,#241a0c,#14100a); border-radius: 12px; text-align: center; box-shadow: 0 0 34px #f0c34a22; }
    .success.show { display: block; animation: pop .35s ease-out; }
    .success h2 { color: var(--gold); font-size: clamp(1.45rem, 4vw, 2.3rem); margin: 0 0 5px; }
    .success p { margin: 4px 0; }
    .clue { margin: 15px auto 3px; max-width: 720px; padding: 18px; border: 2px dashed var(--red); background: #fff8e8; color: #17120e; border-radius: 10px; font-family: Arial, Helvetica, sans-serif; font-size: clamp(1.1rem, 3vw, 1.55rem); font-weight: 800; line-height: 1.35; }
    .hint { margin-top: 16px; text-align: center; color: #748078; font-size: .74rem; }
    @keyframes pop { from { transform: scale(.96); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    @media (min-width: 760px) { .dpad { display: none; } }
  </style>
  <script src="config.js"></script>
</head>
<body>
<main>
  <section class="masthead">
    <div class="eyebrow">DEERFIELD HIGH SCHOOL // SHIELD SYSTEM</div>
    <h1 id="heading">LOST FOREST PROTOCOL</h1>
    <p class="intro" id="intro"></p>
  </section>

  <section class="game-shell">
    <div class="status-row">
      <div class="status">
        <div class="chip">LAST FOUR: <strong class="sequence" id="sequence">— — — —</strong></div>
        <div class="chip">ROOM <strong id="roomNumber">01</strong></div>
      </div>
      <button class="reset" id="resetBtn" type="button">Reset</button>
    </div>

    <div class="canvas-wrap">
      <canvas id="game" width="640" height="420" aria-label="Lost forest navigation puzzle"></canvas>
      <div class="flash" id="flash"></div>
    </div>

    <div class="instructions">Arrow keys / WASD. On phones, use the controls below.</div>
    <div class="dpad" aria-label="Movement controls">
      <button class="up" data-dir="up" aria-label="Move up">▲</button>
      <button class="left" data-dir="left" aria-label="Move left">◀</button>
      <button class="down" data-dir="down" aria-label="Move down">▼</button>
      <button class="right" data-dir="right" aria-label="Move right">▶</button>
    </div>

    <div class="success" id="success">
      <h2 id="successHeading">ACCESS GRANTED</h2>
      <p id="successSubheading"></p>
      <div class="clue" id="finalClue"></div>
    </div>
  </section>
  <div class="hint">If the forest seems impossible, the route may be hidden somewhere else in your materials.</div>
</main>

<script>
(() => {
  const cfg = window.GAME_CONFIG || {};
  document.title = cfg.pageTitle || "Lost Forest";
  document.getElementById("heading").textContent = cfg.heading || "LOST FOREST PROTOCOL";
  document.getElementById("intro").textContent = cfg.intro || "Escape the forest.";
  document.getElementById("successHeading").textContent = cfg.successHeading || "ACCESS GRANTED";
  document.getElementById("successSubheading").textContent = cfg.successSubheading || "The forest has released you.";
  document.getElementById("finalClue").textContent = cfg.finalClue || "YOUR NEXT CLUE GOES HERE";

  const solution = (cfg.solution || ["N","W","S","W"]).join("");
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const sequenceEl = document.getElementById("sequence");
  const roomEl = document.getElementById("roomNumber");
  const successEl = document.getElementById("success");
  const flash = document.getElementById("flash");
  const resetBtn = document.getElementById("resetBtn");

  const W = canvas.width, H = canvas.height;
  const player = { x: W/2, y: H/2, r: 16, speed: 3.15 };
  let keys = {left:false,right:false,up:false,down:false};
  let history = [];
  let won = false;
  let room = 1;
  let transitionLock = 0;
  let lastDir = "down";
  let stepTick = 0;

  function rand(seed) {
    const x = Math.sin(seed * 12.9898) * 43758.5453;
    return x - Math.floor(x);
  }

  function drawPixelTree(x,y,s,seed) {
    const greens = ["#1d4e2a","#275f31","#34733b","#133a22"];
    ctx.fillStyle = "#5a3a22";
    ctx.fillRect(x-s*.10,y+s*.18,s*.20,s*.45);
    for(let i=0;i<8;i++) {
      const ox = (rand(seed+i)-.5)*s*.72;
      const oy = (rand(seed+i+20)-.5)*s*.42 - s*.12;
      ctx.fillStyle = greens[i%greens.length];
      ctx.fillRect(Math.round(x+ox-s*.22), Math.round(y+oy-s*.22), Math.round(s*.44), Math.round(s*.44));
    }
  }

  function drawForest() {
    // NES-style Lost Woods palette / tile treatment.
    ctx.fillStyle = "#0f2c13";
    ctx.fillRect(0,0,W,H);

    // grass tiles
    for(let y=0;y<H;y+=16) for(let x=0;x<W;x+=16) {
      ctx.fillStyle = ((x/16+y/16)%2===0) ? "#2f6d2e" : "#347832";
      ctx.fillRect(x,y,16,16);
      if(((x*7+y*11+room)%5)===0){
        ctx.fillStyle="#173f1d";
        ctx.fillRect(x+3,y+3,3,3);
        ctx.fillRect(x+10,y+9,2,2);
      }
    }

    // sandy / olive clearing, closer to the original Zelda look
    ctx.fillStyle = "#a8a45a";
    ctx.fillRect(92,70,W-184,H-140);
    for(let y=78;y<H-78;y+=20) for(let x=100;x<W-100;x+=20) {
      ctx.fillStyle = ((x+y)/20)%2===0 ? "#b7ad62" : "#9f9852";
      ctx.fillRect(x,y,20,20);
    }

    // four path openings
    ctx.fillStyle="#b7ad62";
    ctx.fillRect(W/2-40,0,80,88);
    ctx.fillRect(W/2-40,H-88,80,88);
    ctx.fillRect(0,H/2-40,108,80);
    ctx.fillRect(W-108,H/2-40,108,80);

    // dense tree wall around clearing
    for(let x=26;x<W;x+=48) {
      if(x < W/2-65 || x > W/2+65) {
        drawPixelTree(x,34,58,x+room*31);
        drawPixelTree(x,H-34,58,x+room*47);
      }
    }
    for(let y=82;y<H-58;y+=52) {
      if(y < H/2-58 || y > H/2+58) {
        drawPixelTree(28,y,58,y+room*53);
        drawPixelTree(W-28,y,58,y+room*71);
      }
    }

    // central Triforce-like marker: recognizable game language without being the solution.
    ctx.fillStyle="#73705a";
    ctx.fillRect(W/2-36,H/2-28,72,56);
    ctx.fillStyle="#4b493b";
    ctx.fillRect(W/2-30,H/2-22,60,44);
    ctx.fillStyle="#e3c34b";
    ctx.beginPath();
    ctx.moveTo(W/2,H/2-14); ctx.lineTo(W/2-11,H/2+4); ctx.lineTo(W/2+11,H/2+4); ctx.closePath(); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(W/2-12,H/2+5); ctx.lineTo(W/2-23,H/2+23); ctx.lineTo(W/2-1,H/2+23); ctx.closePath(); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(W/2+12,H/2+5); ctx.lineTo(W/2+1,H/2+23); ctx.lineTo(W/2+23,H/2+23); ctx.closePath(); ctx.fill();

    // NES-like HUD overlay
    ctx.fillStyle="#080808e8";
    ctx.fillRect(0,0,W,50);
    ctx.font="bold 14px monospace";
    ctx.textAlign="left";
    ctx.fillStyle="#f3f0d8";
    ctx.fillText("-LIFE-", W-130, 18);
    ctx.fillStyle="#d92c2c";
    ctx.font="22px monospace";
    ctx.fillText("♥♥♥", W-132, 42);
    ctx.fillStyle="#f3f0d8";
    ctx.font="bold 14px monospace";
    ctx.fillText("LINK", 18, 19);
    ctx.fillStyle="#65a4d8";
    ctx.fillText("♦ 00", 18, 41);
    ctx.fillStyle="#f3f0d8";
    ctx.fillText("KEY 0", 90, 41);

    // dark pixel vignette
    const g = ctx.createRadialGradient(W/2,H/2,120,W/2,H/2,400);
    g.addColorStop(0,"#0000"); g.addColorStop(1,"#02070399");
    ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  }

  function drawHero() {
    // Larger 8-bit green-tunic hero, deliberately styled like the classic NES adventure sprite.
    const x=Math.round(player.x), y=Math.round(player.y);
    const bob = (Math.floor(stepTick/8)%2===0) ? 0 : 1;

    ctx.save();
    ctx.translate(x,y+bob);

    // Flip the sideways sprite when moving left.
    if(lastDir === "left") ctx.scale(-1,1);

    // shadow
    ctx.fillStyle="#06100699";
    ctx.fillRect(-13,15,26,6);

    if(lastDir === "up") {
      // long pointed green cap
      ctx.fillStyle="#2f8a2f"; ctx.fillRect(-7,-18,15,6); ctx.fillRect(-12,-14,20,6); ctx.fillRect(-16,-10,11,5);
      // blond hair
      ctx.fillStyle="#e1b64a"; ctx.fillRect(-10,-9,20,7); ctx.fillRect(-12,-3,5,8); ctx.fillRect(7,-3,5,8);
      // green tunic
      ctx.fillStyle="#43a83f"; ctx.fillRect(-10,-1,20,17);
      // belt
      ctx.fillStyle="#6b3d22"; ctx.fillRect(-10,8,20,4); ctx.fillStyle="#d5ae45"; ctx.fillRect(-2,8,4,4);
      // boots
      ctx.fillStyle="#6b3d22"; ctx.fillRect(-9,16,7,7); ctx.fillRect(2,16,7,7);
      // shield on back
      ctx.fillStyle="#8d402e"; ctx.fillRect(7,0,9,14); ctx.fillStyle="#d8a73b"; ctx.fillRect(10,4,3,6);
      // sword hilt
      ctx.fillStyle="#d7d7cf"; ctx.fillRect(-15,-1,10,3); ctx.fillStyle="#7b4b24"; ctx.fillRect(-8,-5,3,8);
    } else if(lastDir === "right" || lastDir === "left") {
      // pointed cap trailing behind
      ctx.fillStyle="#2f8a2f"; ctx.fillRect(-15,-13,15,6); ctx.fillRect(-11,-17,12,5);
      // blond hair / head
      ctx.fillStyle="#e1b64a"; ctx.fillRect(-5,-11,13,6);
      ctx.fillStyle="#e8bd78"; ctx.fillRect(-3,-6,12,11);
      // ear
      ctx.fillStyle="#efc889"; ctx.fillRect(7,-6,6,4);
      // eye
      ctx.fillStyle="#171717"; ctx.fillRect(5,-3,2,2);
      // tunic
      ctx.fillStyle="#43a83f"; ctx.fillRect(-8,5,18,14); ctx.fillRect(8,7,5,9);
      // belt
      ctx.fillStyle="#6b3d22"; ctx.fillRect(-7,12,17,4); ctx.fillStyle="#d5ae45"; ctx.fillRect(2,12,4,4);
      // boots
      ctx.fillStyle="#6b3d22"; ctx.fillRect(-6,19,7,7); ctx.fillRect(5,19,7,7);
      // shield forward
      ctx.fillStyle="#99422f"; ctx.fillRect(11,4,10,16); ctx.fillStyle="#e5b445"; ctx.fillRect(14,8,4,8);
      // sword sticking forward
      ctx.fillStyle="#d9ddd5"; ctx.fillRect(20,8,14,3); ctx.fillStyle="#c6ced0"; ctx.fillRect(31,7,5,5);
      ctx.fillStyle="#7b4b24"; ctx.fillRect(18,5,3,9);
    } else {
      // facing down
      ctx.fillStyle="#2f8a2f"; ctx.fillRect(-13,-15,22,7); ctx.fillRect(-17,-11,13,6);
      ctx.fillStyle="#e1b64a"; ctx.fillRect(-10,-8,20,6); ctx.fillRect(-11,-2,5,6); ctx.fillRect(6,-2,5,6);
      ctx.fillStyle="#e8bd78"; ctx.fillRect(-7,-5,14,11);
      // pointed ears
      ctx.fillStyle="#efc889"; ctx.fillRect(-12,-3,5,4); ctx.fillRect(7,-3,5,4);
      // eyes
      ctx.fillStyle="#171717"; ctx.fillRect(-5,0,2,2); ctx.fillRect(3,0,2,2);
      // tunic
      ctx.fillStyle="#43a83f"; ctx.fillRect(-10,6,20,15);
      // belt + buckle
      ctx.fillStyle="#6b3d22"; ctx.fillRect(-10,13,20,4); ctx.fillStyle="#d5ae45"; ctx.fillRect(-2,13,4,4);
      // boots
      ctx.fillStyle="#6b3d22"; ctx.fillRect(-9,21,7,8); ctx.fillRect(2,21,7,8);
      // wooden shield with bright emblem
      ctx.fillStyle="#93442c"; ctx.fillRect(9,7,11,17); ctx.fillStyle="#dca43a"; ctx.fillRect(12,11,5,9); ctx.fillRect(10,14,9,3);
      // sword hilt over shoulder
      ctx.fillStyle="#d7d7cf"; ctx.fillRect(-18,7,12,3); ctx.fillStyle="#7b4b24"; ctx.fillRect(-8,4,3,9);
    }

    ctx.restore();
  }

  function draw() {
    drawForest();
    drawHero();
    if(won) {
      ctx.fillStyle="#0009";ctx.fillRect(0,0,W,H);
      ctx.fillStyle="#f0c34a";ctx.font="bold 34px monospace";ctx.textAlign="center";
      ctx.fillText("FOREST CLEARED",W/2,H/2-8);
      ctx.fillStyle="#fff";ctx.font="18px monospace";ctx.fillText("The route was correct.",W/2,H/2+28);
    }
  }

  function updateSequence() {
    const padded = ["—","—","—","—"];
    history.slice(-4).forEach((d,i)=>padded[4-Math.min(4,history.length)+i]=d);
    sequenceEl.textContent = padded.join(" ");
  }

  function chime() {
    try {
      const ac = new (window.AudioContext || window.webkitAudioContext)();
      const notes=[523.25,659.25,783.99,1046.5];
      notes.forEach((f,i)=>{
        const o=ac.createOscillator(), gain=ac.createGain();
        o.type="square";o.frequency.value=f;
        gain.gain.setValueAtTime(.0001,ac.currentTime+i*.09);
        gain.gain.exponentialRampToValueAtTime(.06,ac.currentTime+i*.09+.015);
        gain.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+i*.09+.18);
        o.connect(gain);gain.connect(ac.destination);
        o.start(ac.currentTime+i*.09);o.stop(ac.currentTime+i*.09+.19);
      });
    } catch(e) {}
  }

  function recordDirection(dir) {
    if(won || transitionLock>0) return;
    transitionLock = 14;
    history.push(dir);
    if(history.length>4) history.shift();
    room++;
    roomEl.textContent = String(room).padStart(2,"0");
    updateSequence();
    flash.classList.add("on");setTimeout(()=>flash.classList.remove("on"),150);
    if(history.length===4 && history.join("")===solution) {
      won=true;
      chime();
      successEl.classList.add("show");
      successEl.scrollIntoView({behavior:"smooth",block:"nearest"});
    }
  }

  function resetPositionFor(dir) {
    if(dir==="W") { player.x=W-player.r-4; player.y=H/2; }
    if(dir==="E") { player.x=player.r+4; player.y=H/2; }
    if(dir==="N") { player.y=H-player.r-4; player.x=W/2; }
    if(dir==="S") { player.y=player.r+4; player.x=W/2; }
  }

  function update() {
    if(transitionLock>0) transitionLock--;
    stepTick++;
    if(!won) {
      let dx=(keys.right?1:0)-(keys.left?1:0);
      let dy=(keys.down?1:0)-(keys.up?1:0);
      if(keys.left) lastDir="left"; else if(keys.right) lastDir="right"; else if(keys.up) lastDir="up"; else if(keys.down) lastDir="down";
      if(dx&&dy){dx*=.707;dy*=.707}
      player.x += dx*player.speed;
      player.y += dy*player.speed;

      if(player.x < -player.r) { recordDirection("W"); resetPositionFor("W"); }
      else if(player.x > W+player.r) { recordDirection("E"); resetPositionFor("E"); }
      else if(player.y < -player.r) { recordDirection("N"); resetPositionFor("N"); }
      else if(player.y > H+player.r) { recordDirection("S"); resetPositionFor("S"); }
    }
    draw();
    requestAnimationFrame(update);
  }

  const mapKey = (key,down) => {
    const k=key.toLowerCase();
    if(k==="arrowleft"||k==="a") keys.left=down;
    if(k==="arrowright"||k==="d") keys.right=down;
    if(k==="arrowup"||k==="w") keys.up=down;
    if(k==="arrowdown"||k==="s") keys.down=down;
  };
  window.addEventListener("keydown",e=>{ if(["ArrowLeft","ArrowRight","ArrowUp","ArrowDown","w","a","s","d","W","A","S","D"].includes(e.key)) e.preventDefault(); mapKey(e.key,true); });
  window.addEventListener("keyup",e=>mapKey(e.key,false));
  window.addEventListener("blur",()=>keys={left:false,right:false,up:false,down:false});

  document.querySelectorAll("[data-dir]").forEach(btn=>{
    const dir=btn.dataset.dir;
    const set=v=>{keys[dir]=v;btn.classList.toggle("active",v)};
    btn.addEventListener("pointerdown",e=>{e.preventDefault();set(true);btn.setPointerCapture(e.pointerId)});
    btn.addEventListener("pointerup",()=>set(false));
    btn.addEventListener("pointercancel",()=>set(false));
    btn.addEventListener("pointerleave",()=>set(false));
  });

  resetBtn.addEventListener("click",()=>{
    history=[];won=false;room=1;player.x=W/2;player.y=H/2;lastDir="down";successEl.classList.remove("show");roomEl.textContent="01";updateSequence();
  });

  updateSequence();
  draw();
  requestAnimationFrame(update);
})();
</script>
</body>
</html>
